name: Documentation

# Builds the documentation site and deploys it to GitHub Pages, on the public repository only.
# It also runs the moment the repository is made public. GitHub Pages must be enabled with
# Settings → Pages → Source: GitHub Actions (a private repository of a free organization cannot
# enable it, so this is done once the repository is public); until then the site is built and
# checked, and the deployment is skipped with a notice saying what to do.

on:
  push:
    branches: [main]
  public:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -e ".[docs]"
      - run: mkdocs build --strict --site-dir site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: pages
        name: Is GitHub Pages enabled, with GitHub Actions as its source?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type' 2>/dev/null || true)
          if [ "$source" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Documentation not deployed::GitHub Pages is not enabled with GitHub Actions as its source. Set Settings → Pages → Source: GitHub Actions, then run this workflow again."
          fi

  deploy:
    if: ${{ !github.event.repository.private && needs.build.outputs.pages == 'true' }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
