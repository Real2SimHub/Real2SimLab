name: CI

on:
  push:
    branches: [main]
  pull_request:
  public:  # the moment the repository is made public
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Per event: a push must not cancel a manually dispatched run of the same branch.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, types, unit tests (${{ matrix.os }}, Python ${{ matrix.python }})
    # Runs automatically once the repository is public; on a private copy, run it by hand.
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: ffmpeg
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y ffmpeg; else brew install ffmpeg; fi
      - name: install
        run: pip install -e ".[dev,mini-swe]"
      - name: ruff
        run: |
          ruff check real2simlab tests examples scripts
          ruff format --check real2simlab tests examples scripts
      - name: pyright
        run: pyright
      - name: unit and end-to-end tests (local backend)
        run: |
          coverage run -m pytest -m "not docker and not bwrap and not live"
          coverage combine
          coverage report

  docker:
    name: Docker integration (Linux)
    # Runs automatically once the repository is public; on a private copy, run it by hand.
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    needs: checks
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -e ".[dev,mini-swe]"
      - name: build images
        run: r2s env build r2s-python r2s-verifier
      - name: Docker tests
        run: pytest -m "docker and not live" -v

  bwrap:
    name: bwrap integration (Linux)
    # Runs automatically once the repository is public; on a private copy, run it by hand.
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    needs: checks
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: system packages; let bwrap create user namespaces
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg bubblewrap
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile bwrap /usr/bin/bwrap flags=(unconfined) {\n  userns,\n}\n' | sudo tee /etc/apparmor.d/bwrap
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
      - run: pip install -e ".[dev]"
      - name: unpack the runtime image (Docker builds it; bwrap runs it)
        run: |
          r2s env build r2s-python
          r2s env unpack r2s-python
      - name: bwrap tests
        run: pytest -m "bwrap and not live" -v

  docs-and-wheel:
    name: documentation and wheel
    # Runs automatically once the repository is public; on a private copy, run it by hand.
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -e ".[dev,docs]"
      - name: documentation
        run: mkdocs build --strict
      - name: wheel, installed into a clean environment
        run: |
          python -m build --wheel
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp && /tmp/clean/bin/r2s --version && /tmp/clean/bin/r2s bench build synthetic --out /tmp/tasks --select bouncing_ball
          /tmp/clean/bin/r2s eval --tasks /tmp/tasks --method oracle --method static --backend local --out /tmp/run
