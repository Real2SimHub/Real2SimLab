site_name: Real2SimLab
site_description: "A unified platform for real-to-simulation. Any method, any benchmark: true to each, together on one scorecard; training tasks with exact truth, datasets and rewards from the same code."
site_url: https://real2simhub.github.io/Real2SimLab/
repo_url: https://github.com/Real2SimHub/Real2SimLab
edit_uri: edit/main/docs/
copyright: Apache-2.0
strict: true

theme:
  name: material
  logo: assets/logo-mark-white.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  font: false  # system fonts: nothing fetched from Google Fonts
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - navigation.tracking
    - navigation.footer
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme)"
      toggle: {icon: material/brightness-auto, name: Light mode}
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Follow the system}

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Real2SimHub/Real2SimLab

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets: {check_paths: true}

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            docstring_style: google
            show_if_no_docstring: false
            merge_init_into_class: true
            filters: ["!^_"]

nav:
  - Home: index.md
  - Get started:
      - Quickstart: quickstart.md
      - Concepts: concepts.md
      - Related work: related.md
      - FAQ: faq.md
  - Tutorials:
      - Evaluate an agent: tutorials/evaluate-agent.md
      - Write a twin: tutorials/write-twin.md
      - Write tasks: tutorials/write-tasks.md
      - Add a benchmark: tutorials/add-benchmark.md
      - Run on a cluster: tutorials/clusters.md
      - Evaluation: guides/evaluation.md
      - Training: guides/training.md
      - Harbor: guides/harbor.md
      - Build on Real2SimLab: guides/build-on.md
      - Platforms: guides/platforms.md
  - Benchmarks:
      - benchmarks/index.md
      - Synthetic: benchmarks/synthetic.md
      - IRIS: benchmarks/iris.md
      - Physics-IQ: benchmarks/physics-iq.md
      - 4DCodeBench: benchmarks/fourdcodebench.md
      - PhysCodeGym: benchmarks/physcodegym.md
      - Video2World: benchmarks/video2world.md
      - PhySimCode: benchmarks/physimcode.md
  - Example run: results.md
  - Specification:
      - spec/index.md
      - Tasks: spec/task.md
      - Captures: spec/capture.md
      - Twins: spec/twin.md
      - Output formats: spec/formats.md
      - Scoring: spec/scoring.md
      - Records: spec/records.md
  - Reference:
      - Command line: reference/cli.md
      - Python API: reference/python.md
      - Architecture: development/architecture.md
      - Security: security.md
      - Contributing: contributing.md
      - Changelog: changelog.md
      - Roadmap: roadmap.md
